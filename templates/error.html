{% extends "base.html" %}
{% block title %}Error {{ code }} · KYC Case Manager{% endblock %}
{% block content %}<section class="panel error-page"><p class="eyebrow">ERROR {{ code }}</p><h1>Something went wrong</h1><p>{{ message }}</p><a class="button primary" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}">Go back</a></section>{% endblock %}
